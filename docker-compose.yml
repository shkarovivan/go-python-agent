services:
  python-worker:
    build:
      context: ./python-worker
    container_name: python-worker
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      # Path to the GGUF model inside the container. The file lives in ./models/ on the host.
      MODEL_PATH: /models/model.gguf
      MAX_TOKENS: "1024"
      N_CTX: "4096"
      # Number of CPU threads = physical cores. Explicit so llama.cpp does not
      # pick logical (hyper-threading) threads, which are slower for inference.
      N_THREADS: "8"
      # Disable Qwen3 thinking mode by default (set "true" to enable reasoning).
      ENABLE_THINKING: "false"
    volumes:
      - ./models:/models:ro

  go-server:
    build:
      context: ./go-server
    container_name: go-server
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      PYTHON_SERVICE_URL: http://python-worker:5000/process
    depends_on:
      - python-worker
